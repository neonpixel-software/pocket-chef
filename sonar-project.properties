sonar.projectKey=neonpixel-software_pocket-chef
sonar.organization=neonpixel-software

sonar.sources=Sources
sonar.tests=Tests
sonar.sourceEncoding=UTF-8

sonar.coverageReportPaths=coverage-ios.xml,coverage-macos.xml

# DEBUG-only preview/seed helpers exist purely to feed SwiftUI #Preview and are never
# exercised by real app code or tests by design — excluded rather than test-padded.
#
# FoundationModelsRecipeCaptureService wraps a real on-device Apple Intelligence call —
# there is no way to invoke it from CI or this development environment (no device/simulator
# here has Apple Intelligence enabled), matching PLAN.md's own testing strategy that this
# specific piece is verified manually/semi-automated on real hardware, not via automated
# tests. CapturedRecipeSchema's toDomain() mapping (the pure-Swift part of the pipeline) is
# tested directly and is NOT excluded.
#
# URLSessionWebPageFetcher does a real network round trip — not exercised by real requests
# in CI either. HTMLPlainTextConverter, the pure-Swift part it delegates to, is tested
# directly and is NOT excluded.
sonar.coverage.exclusions=Sources/PocketChef/Data/DevSupport/**,Sources/PocketChef/Data/Capture/FoundationModelsRecipeCaptureService.swift,Sources/PocketChef/Data/Capture/URLSessionWebPageFetcher.swift
