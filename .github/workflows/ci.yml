name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build & test iOS
        run: |
          xcodebuild -project PocketChef.xcodeproj -scheme PocketChef-iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -enableCodeCoverage YES -resultBundlePath ios.xcresult \
            clean test
      - name: Build & test macOS
        run: |
          xcodebuild -project PocketChef.xcodeproj -scheme PocketChef-macOS \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES -resultBundlePath macos.xcresult \
            clean test
      - name: Convert coverage to SonarCloud's generic format
        run: |
          Scripts/xccov-to-sonarqube-generic.sh ios.xcresult > coverage-ios.xml
          Scripts/xccov-to-sonarqube-generic.sh macos.xcresult > coverage-macos.xml
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: swift-coverage-reports
          path: |
            app/coverage-ios.xml
            app/coverage-macos.xml
          retention-days: 1

  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        # Testcontainers.PostgreSql needs a Docker-compatible daemon — ubuntu-latest runners
        # have Docker preinstalled, so this works unmodified (local dev here uses Podman
        # instead; see docs/plans for why).
        run: dotnet test --no-build --configuration Release

  sonarcloud:
    needs: [changes, build, build-api]
    # One combined SonarCloud project for both Swift (app/) and .NET (api/) — not two
    # separate projects. Runs whenever either side changed (or neither build job failed
    # outright — a job that didn't need to run reports "skipped", which is fine here; only
    # an actual "failure" should block this). Dependabot PRs get no repo secrets, so
    # SONAR_TOKEN is unavailable — skipped for those, matching the build jobs' own behavior.
    if: |
      always() &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.api == 'true') &&
      needs.build.result != 'failure' && needs.build-api.result != 'failure' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download Swift coverage reports
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: swift-coverage-reports
          path: app
      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # sonar.coverageReportPaths is only included when the Swift coverage files actually
          # exist — build is skipped entirely on api-only PRs (nothing under app/** changed),
          # so app/coverage-*.xml never gets downloaded then. Pointing the scanner at a
          # nonexistent file isn't a graceful no-op: it's a hard parse error that aborts the
          # whole analysis (confirmed the hard way on an api-only PR).
          SWIFT_COVERAGE_ARG=""
          if [ -f app/coverage-ios.xml ] && [ -f app/coverage-macos.xml ]; then
            SWIFT_COVERAGE_ARG='/d:sonar.coverageReportPaths=app/coverage-ios.xml,app/coverage-macos.xml'
          fi
          $HOME/.dotnet/tools/dotnet-sonarscanner begin \
            /k:"neonpixel-software_pocket-chef" \
            /o:"neonpixel-software" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.sources="app/Sources,api/src" \
            /d:sonar.tests="app/Tests,api/tests" \
            $SWIFT_COVERAGE_ARG \
            /d:sonar.cs.opencover.reportsPaths="api/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="api/**/*.trx" \
            /d:sonar.coverage.exclusions="app/Sources/PocketChef/Data/DevSupport/**,app/Sources/PocketChef/Data/Capture/FoundationModelsRecipeCaptureService.swift,app/Sources/PocketChef/Data/Capture/URLSessionWebPageFetcher.swift,api/src/PocketChef.DensityApi.Api/Program.cs,api/src/PocketChef.DensityApi.Infrastructure/Migrations/**,api/src/PocketChef.DensityApi.Api/Authentication/ServiceCollectionExtensions.cs,api/src/PocketChef.DensityApi.Infrastructure/ServiceCollectionExtensions.cs,api/src/PocketChef.DensityApi.Application/ServiceCollectionExtensions.cs" \
            /d:sonar.issue.ignore.multicriteria="e1" \
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey="swift:S1075" \
            /d:sonar.issue.ignore.multicriteria.e1.resourceKey="app/Sources/PocketChef/Presentation/RecipeCapture/RecipeURLCaptureView.swift"
      - name: Build .NET API (captures C# semantic data for the scanner)
        run: dotnet build api/PocketChef.DensityApi.slnx --configuration Release
      - name: Test .NET API with coverage
        run: |
          dotnet test api/PocketChef.DensityApi.slnx --configuration Release --logger trx \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: $HOME/.dotnet/tools/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
