name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build & test macOS
        run: |
          xcodebuild -project PocketChef.xcodeproj -scheme PocketChef-macOS \
            -destination 'platform=macOS' clean test
      - name: Build & test iOS
        run: |
          xcodebuild -project PocketChef.xcodeproj -scheme PocketChef-iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17' clean test
