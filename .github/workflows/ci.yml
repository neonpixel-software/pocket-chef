name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build & test iOS
        run: |
          xcodebuild -project PocketChef.xcodeproj -scheme PocketChef-iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -enableCodeCoverage YES -resultBundlePath ios.xcresult \
            clean test
      - name: Build & test macOS
        run: |
          xcodebuild -project PocketChef.xcodeproj -scheme PocketChef-macOS \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES -resultBundlePath macos.xcresult \
            clean test
      - name: Convert coverage to SonarCloud's generic format
        run: |
          Scripts/xccov-to-sonarqube-generic.sh ios.xcresult > coverage-ios.xml
          Scripts/xccov-to-sonarqube-generic.sh macos.xcresult > coverage-macos.xml
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            app/coverage-ios.xml
            app/coverage-macos.xml
          retention-days: 1

  sonarcloud:
    runs-on: macos-26
    needs: build
    defaults:
      run:
        working-directory: app
    # Dependabot-triggered pull_request runs don't get repo secrets (GitHub
    # security measure), so SONAR_TOKEN is unavailable and this job would
    # always fail — skip it for those PRs; the build job still runs.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download coverage reports (built once by the build job, not regenerated here)
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: app
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        timeout-minutes: 10
        with:
          projectBaseDir: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: app/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
