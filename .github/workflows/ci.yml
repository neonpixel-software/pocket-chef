name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build & test iOS
        run: |
          xcodebuild -project PocketChef.xcodeproj -scheme PocketChef-iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -enableCodeCoverage YES -resultBundlePath ios.xcresult \
            clean test
      - name: Build & test macOS
        run: |
          xcodebuild -project PocketChef.xcodeproj -scheme PocketChef-macOS \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES -resultBundlePath macos.xcresult \
            clean test
      - name: Convert coverage to SonarCloud's generic format
        run: |
          Scripts/xccov-to-sonarqube-generic.sh ios.xcresult > coverage-ios.xml
          Scripts/xccov-to-sonarqube-generic.sh macos.xcresult > coverage-macos.xml
      # Dependabot-triggered pull_request runs don't get repo secrets (GitHub
      # security measure), so SONAR_TOKEN is unavailable and these steps would
      # always fail — skip them for those PRs; the build/test steps above still run.
      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarCloud Quality Gate
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
