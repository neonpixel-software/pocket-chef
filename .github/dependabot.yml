version: 2
updates:
  # The Swift app has no SPM dependencies yet (ViewInspector is pulled in via xcodegen's
  # project.yml, not a checked-in Package.swift). Add a "swift" entry here once one shows up.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "UTC"
  - package-ecosystem: "nuget"
    directory: "/api"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "UTC"
