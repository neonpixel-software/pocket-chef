name: PocketChef
options:
  bundleIdPrefix: com.neonpixel.pocketchef
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en

settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Pocket Chef
    SWIFT_VERSION: "6.0"
    # The release version; a release tag must be v<MARKETING_VERSION> (app/docs/release.md).
    # Xcode Cloud replaces the build number with its own, so CURRENT_PROJECT_VERSION stays 1.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The app only uses HTTPS (exempt encryption), so uploads skip the export-compliance question.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    CFBundleLocalizations: [en, es, fr, de, nl]
    CFBundleDevelopmentRegion: en

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    exactVersion: 0.10.5

targets:
  PocketChef-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/PocketChef
    configFiles:
      Debug: Config/PocketChef.xcconfig
      Release: Config/PocketChef.xcconfig
    settings:
      PRODUCT_MODULE_NAME: PocketChef
      PRODUCT_BUNDLE_IDENTIFIER: com.neonpixel.pocketchef
      # Merged with the generated Info.plist: UIBackgroundModes has no INFOPLIST_KEY_ setting.
      # CloudKit sync wakes the app with silent pushes (remote-notification).
      INFOPLIST_FILE: Config/Info-iOS.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
      # iPad must support all four orientations, or App Store validation rejects a
      # multitasking-capable iPad app (ITMS-90474, issue #103).
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
        UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - PocketChef-iOSTests
        - PocketChef-iOSUITests
      gatherCoverageData: true

  PocketChef-iOSTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/UnitTests.xcconfig
      Release: Config/UnitTests.xcconfig
    sources:
      - Tests/PocketChefTests
    dependencies:
      - target: PocketChef-iOS
      - package: ViewInspector

  # Layout checks that need a running app, such as where the header lands (#98).
  # They start the Debug app with -UITestScenario (Data/DevSupport/UITestScenario.swift).
  PocketChef-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/PocketChefUITests
    dependencies:
      - target: PocketChef-iOS

  PocketChef-macOS:
    type: application
    platform: macOS
    sources:
      - Sources/PocketChef
    configFiles:
      Debug: Config/PocketChef.xcconfig
      Release: Config/PocketChef.xcconfig
    settings:
      PRODUCT_MODULE_NAME: PocketChef
      PRODUCT_BUNDLE_IDENTIFIER: com.neonpixel.pocketchef
      # Merged with the generated Info.plist: carries the density API settings.
      INFOPLIST_FILE: Config/Info-macOS.plist
      COMBINE_HIDPI_IMAGES: YES
      # Required for a Mac App Store upload.
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
      ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - PocketChef-macOSTests
        - PocketChef-macOSUITests
      gatherCoverageData: true

  PocketChef-macOSTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/UnitTests.xcconfig
      Release: Config/UnitTests.xcconfig
    sources:
      - Tests/PocketChefTests
    dependencies:
      - target: PocketChef-macOS
      - package: ViewInspector

  PocketChef-macOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/PocketChefUITests
    dependencies:
      - target: PocketChef-macOS
